services:
  qdrant:
    image: qdrant/qdrant:v1.20@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - 6333:6333

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: qdrant
      RUSTFS_SECRET_KEY: qdrant-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      - rustfs
    environment:
      RUSTFS_ACCESS_KEY: qdrant
      RUSTFS_SECRET_KEY: qdrant-secret
    volumes:
      - ./scripts/init-snapshots.sh:/scripts/init-snapshots.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo "Waiting for RustFS..."
          sleep 2
        done

        /usr/bin/rc ls rustfs/qdrant-snapshots >/dev/null 2>&1 ||
          /usr/bin/rc mb rustfs/qdrant-snapshots

        /scripts/init-snapshots.sh

volumes:
  rustfs-data:
